# Live (pixriot.online): sudo docker compose -p pixel-live -f docker-compose-live.yml up -d --build
# Voraussetzung: .env mit APP_URL=https://pixriot.online (Vorlage: .env.production)
x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  TRUSTED_PROXIES: "*"
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-pixel}
  DB_USERNAME: ${DB_USERNAME:-pixel}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    volumes:
      - /opt/pixel-data/live/images/wall-tiles:/var/www/html/public/images/wall-tiles
      - /opt/pixel-data/live/images/snapshots:/var/www/html/public/images/snapshots
      - private-data:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    user: "33:33"
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment: *app-env
    volumes:
      - /opt/pixel-data/live/images/wall-tiles:/var/www/html/public/images/wall-tiles
      - /opt/pixel-data/live/images/snapshots:/var/www/html/public/images/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/nginx/live.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/pixel-data/live/images/wall-tiles:/var/www/html/public/images/wall-tiles:ro
      - /opt/pixel-data/live/images/snapshots:/var/www/html/public/images/snapshots:ro
    depends_on:
      - app
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pixel}
      POSTGRES_USER: ${DB_USERNAME:-pixel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

volumes:
  pgdata:
  private-data:

networks:
  backend:
