# Lokales HTTPS (selbstsigniertes Zertifikat in docker/certs, siehe .gitignore).
# Live:    HTTPS_PORT=8000 HTTPS_SUFFIX=:8000 docker compose -p pixel -f docker-compose-staging.yml -f docker-compose.local-backup.yml -f docker-compose.local-tls.yml up -d
# Staging: HTTPS_PORT=8001 HTTPS_SUFFIX=:8001 docker compose -p pixel-staging -f docker-compose-staging.yml -f docker-compose.local-tls.yml up -d
services:
  app:
    environment:
      APP_URL: https://localhost${HTTPS_SUFFIX:-}
  nginx:
    ports: !override
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/local-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
